<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1b2a3a">
  <meta name="description" content="Matching Numbers: clear the board by pairing numbers that are equal or add up to 10.">
  <title>Matching Numbers</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="stat">Score <strong id="score">0</strong></div>
    <h1>Matching Numbers</h1>
    <div class="stat">Best <strong id="best">0</strong></div>
  </header>

  <main class="play-area">
    <div id="board" class="board"></div>
  </main>

  <footer class="controls">
    <p id="status" class="status" role="status"></p>
    <div class="buttons">
      <button id="add-row" class="btn" type="button">Add row (<span id="rows-left">5</span>)</button>
      <button id="new-game" class="btn btn-primary" type="button">New game</button>
      <button id="hint" class="btn" type="button">Hint</button>
    </div>
  </footer>

  <dialog id="new-game-dialog" class="help">
    <form id="new-game-form">
      <h2>New game</h2>
      <div class="field">
        <span>Level</span>
        <div class="segmented">
          <button type="button" class="seg" data-level="low" aria-pressed="false">Low</button>
          <button type="button" class="seg" data-level="medium" aria-pressed="false">Medium</button>
          <button type="button" class="seg" data-level="hard" aria-pressed="false">Hard</button>
        </div>
      </div>
      <label class="field">
        <span>Numbers (even)</span>
        <input id="numbers-input" type="number" min="10" max="150" inputmode="numeric">
      </label>
      <label class="field">
        <span>Columns</span>
        <input id="columns-input" type="number" min="3" max="12" inputmode="numeric">
      </label>
      <p class="rows-info">Rows: <strong id="rows-output">5</strong></p>
      <p id="settings-error" class="error" hidden></p>
      <div class="buttons">
        <button id="cancel-game" class="btn" type="button">Cancel</button>
        <button id="start-game" class="btn btn-primary" type="submit">Start</button>
      </div>
    </form>
  </dialog>

  <script src="logic.js"></script>
  <script src="app.js"></script>
</body>
</html>
